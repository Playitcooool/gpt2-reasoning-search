[project]
name = "gpt2-reasoning-search"
version = "0.3.0"
description = "Train a small GPT-2-style reasoning model and ground it with search tools"
authors = [
    { name = "Playitcool_", email = "129354153+Playitcooool@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pillow>=10.0.0",
    "safetensors>=0.5.0",
    "sentence-transformers>=5.1.0",
    "tantivy>=0.25.0",
    "tokenizers>=0.21.0",
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=5.15.1",
    "trafilatura>=2.0.0",
    "usearch>=2.16.9",
    "typer>=0.16.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "ruff>=0.12.0",
]

[project.scripts]
gpt2-reasoning-search = "gpt2_reasoning_search.cli:app"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/gpt2_reasoning_search/cli.py" = ["B008"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
